name: Build APK from ZIP

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o NO_ESCAPE_Java8_Gradle611.zip -d project_dir

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 6.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '6.1.1'

      - name: Build APK
        run: |
          PROJECT_PATH=$(find project_dir -name "settings.gradle" -exec dirname {} \; | head -n 1)
          cd "$PROJECT_PATH"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: project_dir/**/app/build/outputs/apk/debug/app-debug.apk
